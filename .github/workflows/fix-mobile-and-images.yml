name: Fix mobile header and landing images
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mobile-and-images.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fixes
        run: python .github/scripts/fix_mobile_and_images.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx src/components/ServiceLanding.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: mobile header and landing image sources"
          git push origin main
