name: Resize mobile logo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/resize-mobile-logo.yml']
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Resize mobile logo
        run: python .github/scripts/resize_mobile_logo.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: improve responsive mobile logo size"
          git push origin main
